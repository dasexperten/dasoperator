# =============================================================================
# Das Operator ERP — the repo guard, in one place.
#
# Called by Checks (on every PR and push) and by every production deploy, so a
# red guard STOPS the shipping instead of running alongside it. Before
# 2026-08-26 the guard was advisory: it sat red for sixteen consecutive runs
# while production deployed green past it, which is a guard that has already
# failed at its only job.
#
# One file, called by all. Copied into each workflow it would drift, and three
# guards that disagree are worse than none.
#
# Add future checks as steps here — they inherit the block automatically.
# =============================================================================

name: Guard

on:
  workflow_call:

jobs:
  migration-numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history on purpose: the guard prints the day each colliding
          # migration was written, and that comes from git log. At depth 1 the
          # message would quietly degrade to "uncommitted" for every file and
          # send the reader back to guesswork.
          fetch-depth: 0

      - name: Check migration number uniqueness
        run: bash scripts/check-migration-numbers.sh

  knowledge-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The whole knowledge graph is built by one parser. A silent regression
      # there produces a graph that looks complete and is not, which is the one
      # failure the corpus rules exist to prevent — so it blocks, like the
      # migration check beside it.
      - name: Check knowledge-graph parser
        run: bash scripts/check-knowledge-parser.sh

  erp-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # workers/erp-*: a timer worker that imports a model client or holds a key
      # in its code does not ship (Owner 2026-09-18: model-free timers only).
      - name: Check erp-* timer workers
        run: node scripts/check-erp-workers.mjs

      # The ERP guard's expected-fires calculator (Viktor Palich, Owner 2026-09-18).
      - name: Install workers toolchain (esbuild)
        working-directory: workers
        run: npm ci --no-audit --no-fund

      - name: Test mail images guard (broken picture removed, never an empty frame)
        run: node --test api/src/lib/mail-images.test.mjs

      - name: Test cron-expect
        run: node --test api/src/lib/cron-expect.test.mjs workers/erp-site-sales-rebuild/src/index.test.mjs

      - name: Test adaptive background job leases
        run: node --test api/src/lib/adaptive-cadence.test.mjs api/src/lib/adaptive-runner.test.mjs

      - name: Install API dependencies for internal route integration tests
        run: npm ci --workspace api --ignore-scripts --no-audit --no-fund

      - name: Test durable cron journal and truthful recovery
        run: node --test api/src/routes/cron-runs.test.mjs workers/_shared/run.test.mjs workers/_shared/run-journal.test.mjs workers/_shared/run-slot.test.mjs api/src/lib/erp-cron-failures.test.mjs api/src/scheduled-strict.test.mjs api/src/lib/crm-website-poll.test.mjs

      - name: Test independent ERP transport clock
        run: python3 -m unittest discover -s scripts/erp-clock -p 'test_*.py'

      - name: Test bounded Direct link refresh
        run: node --test api/src/lib/ugc-dm-links.test.mjs

      - name: Test UGC partial failures and real retry status
        run: node --test api/src/cron-steps.test.mjs api/src/lib/ig-dm-watch.test.mjs api/src/lib/ugc-payout-sweep.test.mjs

      # Konsol payouts (Owner 2026-10-14): limits, own RUB = balance − overdraft,
      # one payment per row, callback status mapping. Money code does not ship red.
      - name: Test UGC payouts and Konsol money rules
        run: node --test api/src/lib/ugc-payouts.test.mjs api/src/lib/ugc-payout-execute.test.mjs web/lib/ugc-payout-cell.test.mjs

      - name: Test UGC Direct retries and four-scenario delivery
        run: node --test api/src/lib/ig-dm-reply.test.mjs api/src/lib/ig-dm-delivery.test.mjs api/src/lib/ig-dm-reply-guard.test.mjs api/src/lib/ig-dm-attachments.test.mjs api/src/lib/ig-dm-refresh.test.mjs api/src/lib/llm-vision.test.mjs

      - name: Test blogger profiles and Direct links
        run: node --test api/src/lib/ugc-blogger-profile-parse.test.mjs api/src/lib/ugc-diagnose.test.mjs web/lib/ugc-instagram-chat.test.mjs

      - name: Test WB gateway, concurrency and retired FBO sync
        run: node --test api/src/lib/wb-gateway.test.mjs

      - name: Test Ozon FBO cursor pagination and complete snapshots
        run: node --test api/src/marketplaces/fbo-sync.test.mjs

      - name: Test Ozon retry and marketplace health SLAs
        run: node --test workers/_marketplace/ozon-read-retry.test.mjs api/src/lib/integration-health.test.mjs workers/_marketplace/wb-sku-daily.test.mjs workers/_marketplace/wb-advert-spend.test.mjs

      - name: Test Vietnam EasyInvoice transport and idempotency contract
        run: node --test workers/erp-vn-einvoice/src/easyinvoice.test.mjs

  stock-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install API test dependencies
        working-directory: api
        run: npm install --no-audit --no-fund
      - name: Test manual ERP warehouse stock source
        run: node --test api/src/routes/external-stocks.test.mjs

      - name: Test published article ledger projection
        run: node --test api/src/lib/article-placements.test.mjs
