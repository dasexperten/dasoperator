name: CF token identity audit 20261030
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only Cloudflare token identity
        shell: python
        env:
          PROBE_CF_MASTER: ${{ secrets.CF_MASTER }}
          PROBE_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROBE_CLOUDFLARE_SUBSCRIPTION_TOKEN: ${{ secrets.CLOUDFLARE_SUBSCRIPTION_TOKEN }}
        run: |
          import os,json,urllib.request,urllib.error
          for name in sorted(k for k in os.environ if k.startswith("PROBE_")):
           token=os.environ[name]
           try:
            req=urllib.request.Request("https://api.cloudflare.com/client/v4/user/tokens/verify",headers={"Authorization":"Bearer "+token})
            with urllib.request.urlopen(req,timeout=20) as response: d=json.load(response)
            result=d.get("result",{})
            print("CF_PROBE "+json.dumps({"slot":name[6:],"success":d.get("success"),"token_id":result.get("id"),"status":result.get("status")}))
           except urllib.error.HTTPError as e: print("CF_PROBE "+json.dumps({"slot":name[6:],"http_status":e.code}))
           except Exception: print("CF_PROBE "+json.dumps({"slot":name[6:],"error":"transport_error"}))
