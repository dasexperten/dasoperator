# =============================================================================
# Das Operator ERP — repo hygiene checks on every PR and push to main
# =============================================================================
# The checks themselves live in _guard.yml, which every production deploy also
# calls. This workflow is the early warning; the deploys are the block. They
# must run the same steps or the warning stops meaning anything.
# =============================================================================

name: Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  guard:
    uses: ./.github/workflows/_guard.yml
