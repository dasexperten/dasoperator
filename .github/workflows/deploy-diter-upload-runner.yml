name: Deploy Dieter upload runner
on:
  push:
    branches: [main]
    paths: ['api/diter-upload-runner/**', '.github/workflows/deploy-diter-upload-runner.yml']
  workflow_dispatch:
concurrency:
  group: diter-upload-runner
  cancel-in-progress: false
jobs:
  guard:
    uses: ./.github/workflows/_guard.yml
  deploy:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install pinned runtime dependencies
        working-directory: api/diter-upload-runner
        run: npm ci --workspaces=false
      - name: Test Dieter-only native adapter
        working-directory: api/diter-upload-runner
        run: npm test
      - name: Deploy Dieter-only native runner
        working-directory: api/diter-upload-runner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SUBSCRIPTION_TOKEN }}
        run: |
          npx wrangler deploy --containers-rollout immediate
          node wait-rollout.mjs
