name: Deploy ERP timer workers

# workers/erp-*: one model-free timer action per worker (Owner 2026-09-18).
# A push to main deploys every erp-* worker whose import tree the push touched —
# including api/src/lib files they import. Deploys run from each worker's own
# folder, then the live schedule is read back and must equal wrangler.toml.

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'api/src/**'
      - 'scripts/check-erp-workers.mjs'
      - '.github/workflows/deploy-erp-workers.yml'
  workflow_dispatch:
    inputs:
      worker:
        description: 'erp-* folder to deploy, or "all"'
        required: true
        default: all

concurrency:
  group: deploy-erp-workers
  cancel-in-progress: false

jobs:
  guard:
    uses: ./.github/workflows/_guard.yml

  plan:
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.pick.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: pick
        env:
          BEFORE: ${{ github.event.before }}
          INPUT: ${{ inputs.worker }}
        run: |
          all=$(ls -d workers/erp-*/ 2>/dev/null | xargs -n1 basename | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          if [ -n "$INPUT" ]; then
            if [ "$INPUT" = "all" ]; then list="$all"; else list="[\"$INPUT\"]"; fi
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(workers/_shared/|workers/package|\.github/workflows/deploy-erp-workers\.yml|scripts/check-erp-workers\.mjs)'; then
            list="$all"
          else
            list=$(node scripts/check-erp-workers.mjs --affected $(git diff --name-only "$BEFORE" "$GITHUB_SHA"))
          fi
          echo "workers=${list:-[]}" >> "$GITHUB_OUTPUT"
          echo "deploying: ${list:-[]}"

  deploy:
    needs: plan
    if: ${{ needs.plan.outputs.workers != '[]' && needs.plan.outputs.workers != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        worker: ${{ fromJson(needs.plan.outputs.workers) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 081ddb85cb399ad62a70210328d744fc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Workers import ERP code from api/src (hono, zod, xlsx, postal-mime): install the api workspace too.
      - name: Install api workspace
        run: npm ci --workspace api --no-audit --no-fund
      - name: Install
        working-directory: workers
        run: npm ci --no-audit --no-fund
      - name: Deploy ${{ matrix.worker }}
        working-directory: workers/${{ matrix.worker }}
        run: ../node_modules/.bin/wrangler deploy
      - name: Live schedule equals wrangler.toml
        working-directory: workers/${{ matrix.worker }}
        run: |
          sleep 3
          curl -sfS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/${{ matrix.worker }}/schedules" \
            | python3 -c "
          import json, re, sys
          live = sorted(s['cron'] for s in json.load(sys.stdin)['result']['schedules'])
          toml = open('wrangler.toml').read()
          m = re.search(r'^\[triggers\][^\[]*?crons\s*=\s*\[([^\]]*)\]', toml, re.M | re.S)
          want = sorted(re.findall(r'\"([^\"]+)\"', m.group(1))) if m else []
          print('live', live, 'file', want)
          assert live == want, 'live schedule differs from wrangler.toml'
          "
      - name: Health
        run: curl -sfS "https://${{ matrix.worker }}.dasexperten.workers.dev/health"
