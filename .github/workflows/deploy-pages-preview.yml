name: Deploy Pages preview (non-prod)

# Test deploys only — never deploys production branch "main" / erp.
on:
  push:
    branches:
      - 'preview/**'
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages-preview.yml'
  workflow_dispatch:

concurrency:
  group: pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build (next-on-pages)
        working-directory: web
        run: npx @cloudflare/next-on-pages@1
      - name: Deploy preview branch to CF Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 081ddb85cb399ad62a70210328d744fc
        run: |
          # CF Pages alias from branch name (slashes → dashes)
          BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "Deploying CF Pages preview branch: $BRANCH"
          npx wrangler@3 pages deploy .vercel/output/static \
            --project-name dasoperator \
            --branch "$BRANCH" \
            --commit-dirty=true
          echo "Expected preview URL pattern:"
          echo "  https://${BRANCH}.dasoperator.pages.dev/emailer"
          echo "  (or check CF Pages dashboard for the exact alias)"
