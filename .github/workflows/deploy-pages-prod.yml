name: Deploy Pages production (erp)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages-prod.yml"
  workflow_dispatch:
    inputs:
      skip_guard:
        description: "Emergency only: ship without the repo guard. Use when the guard ITSELF is broken, never to get past what it found."
        type: boolean
        default: false

concurrency:
  group: pages-prod
  cancel-in-progress: false

jobs:
  # The guard blocks. A push-triggered deploy can never skip it — skip_guard is
  # null on a push, so this job always runs and the deploy always waits for it.
  guard:
    if: ${{ inputs.skip_guard != true }}
    uses: ./.github/workflows/_guard.yml

  deploy:
    needs: guard
    # Runs only if the guard passed, or if a human explicitly chose to ship
    # without it by hand — a bypass that is on the record, not a default.
    if: ${{ always() && (needs.guard.result == 'success' || inputs.skip_guard == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build (next-on-pages)
        working-directory: web
        run: npx @cloudflare/next-on-pages@1
      - name: Deploy to production (erp.dasexperten.com)
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 081ddb85cb399ad62a70210328d744fc
        run: npx wrangler@3 pages deploy .vercel/output/static --project-name dasoperator --branch main --commit-dirty=true
      - name: Verify production ERP routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /analytics; do
            ok=0
            for attempt in {1..12}; do
              status="$(curl --silent --show-error --output /tmp/erp-body --write-out '%{http_code}' "https://erp.dasexperten.com${path}")"
              bytes="$(wc -c < /tmp/erp-body)"
              if [[ "$status" == "200" && "$bytes" -gt 1000 ]]; then
                echo "PASS ${path}: HTTP ${status}, ${bytes} bytes"
                ok=1
                break
              fi
              echo "WAIT ${path}: attempt ${attempt}/12 returned HTTP ${status}, ${bytes} bytes"
              sleep 5
            done
            if [[ "$ok" != "1" ]]; then
              echo "FAIL ${path}: production did not return a rendered page"
              exit 1
            fi
          done
