name: Deploy Pages production (erp)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages-prod.yml'
  workflow_dispatch:

concurrency:
  group: pages-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build (next-on-pages)
        working-directory: web
        run: npx @cloudflare/next-on-pages@1
      - name: Deploy to production (erp.dasexperten.com)
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 081ddb85cb399ad62a70210328d744fc
        run: npx wrangler@3 pages deploy .vercel/output/static --project-name dasoperator --branch main --commit-dirty=true
