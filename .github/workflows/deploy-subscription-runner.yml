name: Deploy Diana subscription runner
on:
  push:
    branches: [main]
    paths: ['api/subscription-runner/**', '.github/workflows/deploy-subscription-runner.yml']
  workflow_dispatch:
concurrency:
  group: diana-subscription-runner
  cancel-in-progress: false
jobs:
  guard:
    uses: ./.github/workflows/_guard.yml
  deploy:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned runner dependencies
        working-directory: api/subscription-runner
        run: npm ci --workspaces=false
      - name: Test native adapter
        working-directory: api/subscription-runner
        run: npm test
      - name: Deploy native runner
        working-directory: api/subscription-runner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SUBSCRIPTION_TOKEN }}
        run: npx wrangler deploy
