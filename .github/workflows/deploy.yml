# =============================================================================
# Das Operator ERP — auto-deploy Workers API on push to main
# =============================================================================
# Triggers on push to main when files in api/ change.
# Deploys via Cloudflare Wrangler using CLOUDFLARE_API_TOKEN secret.
#
# Note: npm cache disabled — repo doesn't have package-lock.json yet.
# Cache will be enabled in a follow-up PR after first deploy generates lock.
# =============================================================================

name: Deploy Workers API

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
  workflow_dispatch:
    inputs:
      skip_guard:
        description: 'Emergency only: ship without the repo guard. Use when the guard ITSELF is broken, never to get past what it found.'
        type: boolean
        default: false

concurrency:
  group: deploy-workers-api
  cancel-in-progress: false

jobs:
  # The guard blocks. A push-triggered deploy can never skip it — skip_guard is
  # null on a push, so this job always runs and the deploy always waits for it.
  guard:
    if: ${{ inputs.skip_guard != true }}
    uses: ./.github/workflows/_guard.yml

  deploy:
    needs: guard
    # Runs only if the guard passed, or if a human explicitly chose to ship
    # without it by hand — a bypass that is on the record, not a default.
    if: ${{ always() && (needs.guard.result == 'success' || inputs.skip_guard == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: api
        run: npm install --legacy-peer-deps

      - name: Deploy Worker to Cloudflare
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Print deployment info
        if: success()
        run: |
          echo "Worker deployed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Commit: ${{ github.sha }}"

