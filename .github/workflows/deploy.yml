# =============================================================================
# Das Operator ERP — auto-deploy Workers API on push to main
# =============================================================================
# Triggers on push to main when files in api/ change.
# Deploys via Cloudflare Wrangler using CLOUDFLARE_API_TOKEN secret.
#
# Note: npm cache disabled — repo doesn't have package-lock.json yet.
# Cache will be enabled in a follow-up PR after first deploy generates lock.
# =============================================================================

name: Deploy Workers API

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
  workflow_dispatch:

concurrency:
  group: deploy-workers-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: api
        run: npm install --legacy-peer-deps

      - name: Deploy Worker to Cloudflare
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Print deployment info
        if: success()
        run: |
          echo "Worker deployed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Commit: ${{ github.sha }}"

