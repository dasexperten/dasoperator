name: Diana Direct subscription check
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check existing shared subscription door without creator data
        env:
          DIRECT_SECRET: ${{ secrets.CODEX_ROUTE_SECRET }}
        run: |
          set -eu
          test -n "$DIRECT_SECRET"
          response=$(curl --max-time 210 --fail-with-body -sS -X POST \
            -H "X-Codex-Route-Secret: $DIRECT_SECRET" \
            https://dasoperator-api.dasexperten.workers.dev/internal/ugc/direct-subscription-check)
          printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") and d.get("model_verified"), d'
          echo 'Shared subscription inference verified'
