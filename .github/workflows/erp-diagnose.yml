name: ERP diagnose (read-only)

# Read-only look at the live ERP: Diana reply-step failures, minute-check journal,
# and 2 minutes of live logs from the ERP worker and Diana's subscription runner.
# Changes nothing. Added 2026-11-06 for the Owner's report of an ERP / Workers fault.

on:
  workflow_dispatch:

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 081ddb85cb399ad62a70210328d744fc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: api
        run: npm install --no-audit --no-fund >/dev/null
      - name: Failures and reply state
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          q() { npx wrangler d1 execute das_erp_dev --remote --json --command="$1" | python3 -c 'import json,sys;d=json.load(sys.stdin);[print(json.dumps(r,ensure_ascii=False)[:1500]) for x in d for r in x.get("results",[])]' || true; }
          echo "== context failures"; q "SELECT key, datetime(updated_at/1000,'unixepoch') at, value FROM crm_sync_state WHERE key LIKE 'diana_context%'"
          echo "== reply / minute-check state keys"; q "SELECT key, datetime(updated_at/1000,'unixepoch') at, substr(value,1,600) v FROM crm_sync_state WHERE key LIKE '%ig_dm%' OR key LIKE '%reply%' OR key LIKE '%diana%' ORDER BY updated_at DESC LIMIT 25"
          echo "== tables"; q "SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE '%run%' OR name LIKE '%journal%' OR name LIKE '%cron%' OR name LIKE '%incident%')"
      - name: Live logs, 120 s
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUB_TOKEN: ${{ secrets.CLOUDFLARE_SUBSCRIPTION_TOKEN }}
        run: |
          (timeout 120 npx wrangler tail dasoperator-api --format json > api.log 2>&1 || true) &
          (CLOUDFLARE_API_TOKEN="$SUB_TOKEN" timeout 120 npx wrangler tail diana-subscription-runner --format json > sub.log 2>&1 || true) &
          wait
          for f in api.log sub.log; do
            echo "===== $f"; python3 - "$f" <<'PY'
          import json,sys
          raw=open(sys.argv[1]).read()
          dec=json.JSONDecoder(); i=0; n=0
          while i < len(raw):
              j=raw.find('{',i)
              if j<0: break
              try: o,k=dec.raw_decode(raw,j)
              except Exception: i=j+1; continue
              i=k; n+=1
              ev=o.get('event') or {}
              head=(ev.get('cron') or (ev.get('request') or {}).get('url') or '')
              print(o.get('outcome'), head, o.get('cpuTime'), o.get('wallTime'))
              for l in o.get('logs',[]): print('   log', str(l.get('message'))[:400])
              for e in o.get('exceptions',[]): print('   EXC', e.get('name'), str(e.get('message'))[:400])
          print('events', n)
          if n==0: print(raw[-3000:])
          PY
          done
