<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--paper);}
  .card{padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow-hairline);}
  .swatch{flex:1;height:72px;display:flex;align-items:flex-end;padding:6px 8px;}
  .swatch .n{font:500 10px/1 var(--font-mono);color:var(--fg-3);}
  .swatch.dark .n{color:var(--paper);}
  .row2{display:flex;gap:10px;}
  .txtchip{flex:1;padding:10px 12px;border-radius:var(--radius-sm);box-shadow:var(--shadow-hairline);display:flex;flex-direction:column;gap:3px;}
  .txtchip .tx{font:500 13px/1 var(--font-body);}
  .txtchip .sub{font:500 10px/1 var(--font-mono);color:var(--fg-3);}
</style></head><body>
<div class="card">
  <div class="dx-label">Neutrals · apothecary paper &amp; stone</div>
  <div class="row">
    <div class="swatch" style="background:#FFFFFF"><span class="n">#FFFFFF</span></div>
    <div class="swatch" style="background:#FBFAF6"><span class="n">paper</span></div>
    <div class="swatch" style="background:#F3F0E8"><span class="n">sunk</span></div>
    <div class="swatch" style="background:#EDE8DD"><span class="n">bone</span></div>
    <div class="swatch" style="background:#E3DDCF"><span class="n">stone-100</span></div>
    <div class="swatch" style="background:#C9C1B0"><span class="n">stone-200</span></div>
    <div class="swatch dark" style="background:#9C9384"><span class="n">stone-300</span></div>
    <div class="swatch dark" style="background:#6E6558"><span class="n">stone-400</span></div>
    <div class="swatch dark" style="background:#4A4238"><span class="n">stone-500</span></div>
    <div class="swatch dark" style="background:#2E2822"><span class="n">stone-600</span></div>
  </div>
</div>
</body></html>
