<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--paper);}
  .card{padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;gap:10px;}
  .swatch{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .chip{height:56px;border-radius:var(--radius-sm);box-shadow:var(--shadow-hairline);}
  .hex{font:500 11px/1 var(--font-mono);color:var(--fg-3);}
  .name{font:700 11px/1 var(--font-narrow);text-transform:uppercase;letter-spacing:0;color:var(--fg-1);}
  .sub{font:400 11px/1.3 var(--font-narrow);color:var(--fg-3);max-width:120px;}
</style></head><body>
<div class="card">
  <div class="dx-label">Product lines / accents</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#0D199E"></div><div class="name">innoWeiss</div><div class="hex">#0D199E</div><div class="sub">whitening · enzymes</div></div>
    <div class="swatch"><div class="chip" style="background:#1A1519"></div><div class="name">Detox</div><div class="hex">#1A1519</div><div class="sub">charcoal</div></div>
    <div class="swatch"><div class="chip" style="background:#0E7C66"></div><div class="name">Fresh</div><div class="hex">#0E7C66</div><div class="sub">mint · daily</div></div>
    <div class="swatch"><div class="chip" style="background:#7A3B8A"></div><div class="name">Sensitive</div><div class="hex">#7A3B8A</div><div class="sub">gentle</div></div>
    <div class="swatch"><div class="chip" style="background:#FE7F2D"></div><div class="name">Kids</div><div class="hex">#FE7F2D</div><div class="sub">children</div></div>
  </div>
</div>
</body></html>
