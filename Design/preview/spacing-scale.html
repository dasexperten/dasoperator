<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--paper);}
  .card{padding:20px 24px;display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;gap:16px;align-items:flex-end;}
  .tok{display:flex;flex-direction:column;gap:6px;}
  .bar{background:var(--brand-schwarz);border-radius:2px;}
  .n{font:500 10px/1 var(--font-mono);color:var(--fg-3);white-space:nowrap;}
</style></head><body>
<div class="card">
  <div class="dx-label">Spacing · 8pt scale</div>
  <div class="row">
    <div class="tok"><div class="bar" style="width:4px;height:32px"></div><div class="n">1 · 4</div></div>
    <div class="tok"><div class="bar" style="width:8px;height:32px"></div><div class="n">2 · 8</div></div>
    <div class="tok"><div class="bar" style="width:12px;height:32px"></div><div class="n">3 · 12</div></div>
    <div class="tok"><div class="bar" style="width:16px;height:32px"></div><div class="n">4 · 16</div></div>
    <div class="tok"><div class="bar" style="width:24px;height:32px"></div><div class="n">5 · 24</div></div>
    <div class="tok"><div class="bar" style="width:32px;height:32px"></div><div class="n">6 · 32</div></div>
    <div class="tok"><div class="bar" style="width:48px;height:32px"></div><div class="n">7 · 48</div></div>
    <div class="tok"><div class="bar" style="width:64px;height:32px"></div><div class="n">8 · 64</div></div>
    <div class="tok"><div class="bar" style="width:96px;height:32px"></div><div class="n">9 · 96</div></div>
  </div>
</div>
</body></html>
