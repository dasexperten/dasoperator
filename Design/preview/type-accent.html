<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--paper);}
  .card{padding:20px 24px;display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;align-items:baseline;gap:18px;border-bottom:1px solid var(--border-hairline);padding:8px 0;}
  .row:last-child{border-bottom:none;}
  .meta{font:500 10px/1 var(--font-mono);color:var(--fg-3);width:140px;flex:none;}
  .spec{flex:1;min-width:0;}
  .ing,.ing strong{font:700 12px/1.5 var(--font-mono);color:var(--fg-2);letter-spacing:0 !important;}
  .dx-label{letter-spacing:0 !important;text-transform:none !important;font-size:13px !important;}
  .dx-quote{letter-spacing:0 !important;}
  .meta{letter-spacing:0 !important;}
</style></head><body>
<div class="card">
  <div class="dx-label">Accent · Fraunces serif &amp; Manrope</div>
  <div class="row"><div class="spec" style="font:700 56px/1 var(--font-accent);letter-spacing:-.02em;font-variant-numeric:tabular-nums;">92<span style="color:var(--brand-rot)">%</span></div><div class="meta">numeral · 56/700 serif</div></div>
  <div class="row"><div class="spec dx-quote">"Enzymes dissolve stains at a molecular level. No grinding. No damage."</div><div class="meta">quote · italic serif</div></div>
  <div class="row"><div class="spec ing"><strong>Aqua, Xylitol, Hydrated&nbsp;Silica, Glycerin, Sorbitol, Peppermint&nbsp;Oil, Stevia</strong></div><div class="meta">clinical mono · 12</div></div>
</div>
</body></html>
