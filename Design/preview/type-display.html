<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--paper);}
  .card{padding:20px 24px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:baseline;gap:18px;border-bottom:1px solid var(--border-hairline);padding:8px 0;}
  .row:last-child{border-bottom:none;}
  .meta{font:700 10px/1 var(--font-mono);color:var(--fg-3);width:130px;flex:none;letter-spacing:0;}
  .spec{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pn{font-family:'Eras Bold ITC', var(--font-display);font-weight:700;letter-spacing:0;}
  h2.hd{font:700 14px/1 var(--font-display);letter-spacing:0;margin:0;}
</style></head><body>
<div class="card">
  <h2 class="hd">Display · Eras Bold ITC (brand wordmark face)</h2>
  <div class="row"><div class="spec pn" style="font-size:48px">Fluoride-free.</div><div class="meta">display · 48</div></div>
  <div class="row"><div class="spec pn" style="font-size:32px">Microbiome-friendly</div><div class="meta">h2 · 32</div></div>
  <div class="row"><div class="spec pn" style="font-size:24px">Innovativ und praktisch</div><div class="meta">h3 · 24</div></div>

  <h2 class="hd" style="margin-top:14px">Product names · Eras Bold ITC</h2>
  <div class="row"><div class="spec pn" style="font-size:28px;color:#0D199E">innoWeiss</div><div class="meta">product · 28</div></div>
  <div class="row"><div class="spec pn" style="font-size:24px;color:#1A1519">Detox</div><div class="meta">product · 24</div></div>
  <div class="row"><div class="spec pn" style="font-size:20px;color:#0E7C66">Fresh</div><div class="meta">product · 20</div></div>
  <div class="row"><div class="spec pn" style="font-size:18px;color:#7A3B8A">Sensitive</div><div class="meta">product · 18</div></div>
  <div class="row"><div class="spec pn" style="font-size:16px;color:#FE7F2D">Kids</div><div class="meta">product · 16</div></div>
</div>
</body></html>
