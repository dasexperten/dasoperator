# =============================================================================
# Das Operator ERP â€” Workers API configuration
# =============================================================================

name = "dasoperator-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

account_id = "081ddb85cb399ad62a70210328d744fc"

# -----------------------------------------------------------------------------
# D1 Database â€” operational source of truth
# Phase 1.1: 16 tables created
# Phase 1.2: 59 reference rows seeded
# -----------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "das_erp_dev"
database_id = "0653d156-5069-4c46-a496-fad982d0d1df"

# -----------------------------------------------------------------------------
# R2 Bucket â€” document storage
# Stores: PDF (CI/PL/contracts), product photos, packing photos, certificates
# Phase 1.3: bucket created in EEUR region
# Folder structure inside bucket: /invoices, /packing-lists, /contracts, /photos
# -----------------------------------------------------------------------------
[[r2_buckets]]
binding = "DOCS"
bucket_name = "das-erp-docs-dev"

[[r2_buckets]]
binding = "SKILLS_BUCKET"
bucket_name = "das-skills"

# -----------------------------------------------------------------------------
# R2 Bucket â€” Pricer skill price lists (.md files)
# Stores: PL-DASEX-USD, PL-DISTR_RF, PL-INT_USD, PL-PRCH_CNY, PL-PRCH_USD, PL-RSP_RF
# Pricer skill = source of truth. Edit .md â†’ re-upload via sync script.
# -----------------------------------------------------------------------------
[[r2_buckets]]
binding = "PRICELISTS"
bucket_name = "das-pricelists"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "self-learning"

[[r2_buckets]]
binding = "ARCHIVE_OLD"
bucket_name = "das-operator-data"

# -----------------------------------------------------------------------------
# R2 Bucket â€” website CRM raw archive (Phase 12.0 â€” dasexperten.com orders)
# Raw JSON snapshot of every website order + customer under crm/:
#   crm/orders/{source}/{order_number}.json Â· crm/customers/{id}.json Â·
#   crm/imports/â€¦  D1 (crm_orders/crm_customers) stays the queryable layer,
#   this bucket is the replay/audit source of truth (ADR-001 split).
# Bucket is shared with the loyalty-bridge Worker (its RetailCRM export lives
# at top-level keys); dasoperator only ever touches the crm/ prefix.
# -----------------------------------------------------------------------------
[[r2_buckets]]
binding = "CUSTOMERS_DB"
bucket_name = "das-loyalty-customers"

# -----------------------------------------------------------------------------
# KV Namespace â€” sequences cache
# Stores: next_number for DEE/DEI/DEASEAN/DEC/CI/PL counters
# Pattern: KV first, D1 second (write-through cache)
# -----------------------------------------------------------------------------
[[kv_namespaces]]
binding = "COUNTERS"
id = "c63b6104eb1b43009f2ae65f51333d36"

# -----------------------------------------------------------------------------
# KV Namespace â€” daily FX rates
# Stores: USD/RUB, USD/CNY, USD/EUR, etc. with date as key
# TTL: 24 hours (refreshed by daily cron)
# -----------------------------------------------------------------------------
[[kv_namespaces]]
binding = "FX"
id = "47ac2dde6cd041c09597272e422a6c32"

# -----------------------------------------------------------------------------
# KV Namespace â€” generic ERP cache
# Stores: hot lookups (product invoice labels, partner banking refs),
#         session data when Cloudflare Access integrated
# TTL: variable per key
# -----------------------------------------------------------------------------
[[kv_namespaces]]
binding = "CACHE"
id = "43f2004892714cbb919e5174ce2a8556"

# -----------------------------------------------------------------------------
# Service Binding â€” emailer-bridge Worker
# Lets dasoperator-api call emailer-bridge directly (in-process, no HTTP loop).
# Cloudflare blocks Workerâ†’same-account-Worker via *.workers.dev (error 1042),
# so the inbox cron must use this binding to reach emailer.
# -----------------------------------------------------------------------------
[[services]]
binding = "EMAILER"
service = "emailer-bridge"

# Self-binding: lets scheduled handlers call our own routes without going
# through *.workers.dev (which Cloudflare blocks for same-account loops
# with error 1042). Without this, runMarketplaceSync() in scheduled.ts
# tried fetch('https://dasoperator-api.dasexperten.workers.dev/...') and
# silently failed every hour for ~40 hours starting 2026-05-09 19:34 UTC.
[[services]]
binding = "SELF"
service = "dasoperator-api"

# Marketplace specialists (Owner 2026-07-21): pulse Refresh → their /sync-sales.
# Same-account *.workers.dev is blocked (1042/404); service bindings only.
[[services]]
binding = "DASHA_OZON"
service = "dasha-ozon"

[[services]]
binding = "ARINA_WB"
service = "arina-wb"

# -----------------------------------------------------------------------------
# Email Sending binding â€” Cloudflare Email Sending (Beta)
# Sending domain: notify.dasexperten.com (DNS/SPF/DKIM configured in Cloudflare,
# Email Sending enabled, quota 200/day as of setup). This is a SEPARATE product
# from Email Routing on dasexperten.com (inbound forwarding) â€” do not mix them.
#
# No destination_address / allowed_destination_addresses set â†’ unrestricted
# recipient (required: transactional emails go to arbitrary customers/leads,
# not a fixed inbox). Allowed sender addresses are enforced in application
# code (see src/services/email.ts), not at the binding level:
#   no-reply@, notifications@, orders@, forms@, system@ â€” all @notify.dasexperten.com
# -----------------------------------------------------------------------------
[[send_email]]
name = "EMAIL"

# -----------------------------------------------------------------------------
# Cron triggers
#
# 0 12 * * *   â€” daily FX refresh from CBR at 12:00 UTC (15:00 Moscow time,
#                after CBR daily publication at 11:30 Moscow). Phase 2.0c-2b.
# 0 */4 * * *  â€” auto-delivery sweep only (Owner 2026-07-22 cutover).
#                Ozon/WB marketplace STOCKS owned by dasha-ozon / arina-wb
#                (not this Worker). Slot kept so auto-delivery still runs
#                against ERP stock rows specialists wrote.
# 0 * * * *    â€” hourly WB review reply retry sweep (sweep-retries endpoint).
#
# 20 * * * *  â€” hourly bank-tx auto-match retry sweep (covers ambiguous + partner_not_found
#                rows that may now be resolvable after operations were created post-webhook).
#
# 0 2 * * *   â€” nightly bank-tx rematch sweep (2:00 UTC = 6:00 Yerevan).
#                Re-runs auto-match on every unmatched bank_transaction within
#                last 180 days. Catches old txns that became matchable after
#                new partners/operations/rules were added during the day.
#
# */15 * * * * â€” every 15 min Telegram chat â†’ invoice_inbox ingestion.
#                Phase 9.x. Pulls invoices/acceptance from registered
#                telegram_contact sources via telegramer-bridge.
#
# Handler: src/scheduled.ts handleScheduled â€” dispatches by event.cron string.
# -----------------------------------------------------------------------------
#
# 30 */3 * * *â€” Tamara lane: Ozon review draft-prep (every 3h, after :20 feeds).
#                Owner 2026-07-20: reply craft owner = Tamara only; ERP hosts job.
#                Drafts land in dasoperator for UI; cadence was */6 then tightened
#                to 3h (was more aggressive when paired with 20m WB ticks).
#
# 0 4 * * 4   â€” WB weekly realization auto-pull schedule. Thursday 04:00 UTC = 
#                07:00 ÐœÐ¡Ðš, after WB publishes the prev-week report on Thursday. 
#                Creates a 'pending' task in marketplace_pull_tasks. Phase 8.0.
#
# 0 3 5 * *   â€” Ozon monthly transaction auto-pull schedule. 5th of month 
#                03:00 UTC = 06:00 ÐœÐ¡Ðš, gives Ozon time to finalize prev month. 
#                Creates a 'pending' task. Phase 8.0.
#
# Note: */15 cron above ALSO ticks marketplace_pull_tasks (one task per tick)
# to advance fetch pagination and build operations from staging.
#
# 30 2 * * *  â€” nightly web-analytics ingestion (05:30 ÐœÐ¡Ðš): GA4 + Metrika
#                + Clarity (+ Direct when configured) â†’ web_analytics_daily /
#                web_behavior_snapshots. Clarity = EXACTLY 1 API call/night
#                (10/day hard limit). Handler: lib/web-analytics-sync.ts.
#
# 7 * * * *   â€” hourly Stripe reconciliation poller (Phase 12.0 website CRM).
#                Lists succeeded PaymentIntents of the dasexperten.com checkout
#                since the crm_sync_state cursor and upserts them into
#                crm_orders/crm_customers (+ R2 crm/ archive). The webhook
#                /api/crm/website/webhook/stripe is the real-time path; this
#                poller is the safety net and also sweeps refunds.
#
[triggers]
# Tamara care lane (Owner 2026-07-20): reviews / Q&A / customer replies â€” every 3h only
#   10 */3 * * *  WB auto-reply (was */20 â€” too aggressive)
#   20 */3 * * *  MP feeds: Ozon+WB reviews/questions ingest (was 40 */6)
#   30 */3 * * *  Ozon draft-prep (was 50 */6)
# Owner 2026-07-27: care crons REMOVED here for good. Cloudflare replaces the
# whole schedule set on every deploy, so deleting them in the dashboard only
# lasted until the next push. Craft owner is Tamara: worker `tamara-haar`
# now fires :20 feeds -> :30 draft-prep (calls /api/reviews/ozon-prep-tick
# here) -> :40 publish. ERP stays host + storage, no timers of its own.
# Removed: "20 */3" (already a no-op), "30 */3" (draft-prep), "10 */3" (WB
# auto-reply — ERP has no WB token since the reissue, it was dead weight).
crons = ["35 * * * *", "0 3 * * *", "0 1 * * *", "0 12 * * *", "0 * * * *", "0 */4 * * *", "5 */6 * * *", "*/2 * * * *", "0 0 * * *", "15 * * * *", "30 */6 * * *", "*/15 * * * *", "0 2 * * *", "30 2 * * *", "0 4 * * 4", "0 3 5 * *", "0 4 1-7 * 3", "*/10 * * * *", "0 5 * * *", "0 4 * * *", "23 */3 * * *", "0 3 1 * *", "7 * * * *"]


# -----------------------------------------------------------------------------
# Plain env vars (visible in source â€” not secrets)
# Used by /api/crm/* routes (Retail CRM REST v5).
# Token is RETAIL_CRM_TOKEN, set as Worker secret separately.
# -----------------------------------------------------------------------------
[vars]
# Слой 3 (Владелец 2026-08-29): экран CRM → Orders читает зеркало crm_orders_ru
# в D1 ("d1"). Откат на живую ленту dasexperten.ru — "feed", один пуш.
CRM_ORDERS_SOURCE = "d1"
# Owner 2026-07-27: how many Ozon reviews are drafted in parallel. One draft is
# ~7 LLM gates of waiting, so this is the throughput dial, not CPU.
DRAFT_CONCURRENCY = "10"
RETAIL_CRM_DOMAIN = "dasexperten"

# Owner 2026-08-03: the /api/* auth gate. "observe" logs every unauthenticated
# call and blocks nothing; "enforce" returns 401. Flipped by editing this line
# and redeploying — no code change, so locking the door is never bundled with
# shipping something new.
AUTH_GATE = "observe"
YANDEX_METRIKA_COUNTER = "107720199"


# Agent seats (Owner 2026-07-30): the Emailer "Ответит агент" button now calls
# the agent's own pen — its charter, its memory, its name — instead of the
# shared drafting service that signed every letter as the Owner.
# Same-account *.workers.dev is blocked; service bindings only.
[[services]]
binding = "LAUDA_COMMERCE"
service = "lauda-commerce"

[[services]]
binding = "ROBERTA_CONTENT"
service = "roberta-content"

[[services]]
binding = "JULIAN_GEO"
service = "julian-geo"

[[services]]
binding = "ALEXANDRA_OBNORSKAYA"
service = "alexandra-obnorskaya"

[[services]]
binding = "TAMARA_HAAR"
service = "tamara-haar"

[[services]]
binding = "JUSTINA_FINANCE"
service = "justina-finance"

[[services]]
binding = "MINA_SYSADMIN"
service = "mina-sysadmin"

[[services]]
binding = "MARIKA_BRAND"
service = "marika-brand"

[[services]]
binding = "MAYA_INTELLIGENCE"
service = "maya-intelligence"

[[services]]
binding = "ZINA_LOGISTICS"
service = "zina-logistics"

[[services]]
