services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:0.23.6@sha256:8c5206776f0db0deebf489b5e0a4a6b51ac5d483d677aed2dc609f1554ee1eaa
    container_name: openwa-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:2785:2785"
    environment:
      NODE_ENV: production
      PORT: "2785"
      DATABASE_TYPE: sqlite
      DATA_PATH: /app/data
      AUTO_START_SESSIONS: "true"
      BASE_URL: https://openwa.dasexperten.com
      DASHBOARD_URL: https://openwa.dasexperten.com
      CORS_ORIGINS: https://openwa.dasexperten.com,https://erp.dasexperten.com
    volumes:
      - openwa-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2785/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  tunnel:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    container_name: openwa-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: cloudflared.env
    network_mode: host
    depends_on:
      openwa: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  openwa-data:
    name: openwa-data
