<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--paper);}
  .card{padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
  img{max-width:100%;height:auto;display:block;}
  .lockup{background:var(--paper-raised);padding:16px 22px;border-radius:var(--radius-md);box-shadow:var(--shadow-hairline);}
  .inv{background:var(--brand-schwarz);padding:20px 22px;border-radius:var(--radius-md);}
  .inv img{filter:invert(1) hue-rotate(180deg);}
</style></head><body>
<div class="card">
  <div class="dx-label">Logo · primary lockup</div>
  <div class="lockup"><img src="../assets/logo-full.png" alt="das experten — innovativ und praktisch" style="height:48px;width:auto"/></div>
  <div class="inv"><img src="../assets/logo-full.png" alt="das experten" style="height:44px;width:auto"/></div>
</div>
</body></html>
