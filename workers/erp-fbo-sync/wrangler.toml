# erp-fbo-sync — retired duplicate marketplace pull.
# Ozon cluster stock is refreshed by erp-ozon-stocks and cluster sales by
# erp-ozon-sales in their single daily cycles. WB FBO is retired.
name = "erp-fbo-sync"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "081ddb85cb399ad62a70210328d744fc"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "das_erp_dev"
database_id = "0653d156-5069-4c46-a496-fad982d0d1df"

[[services]]
binding = "ERP"
service = "dasoperator-api"

[triggers]
crons = []
