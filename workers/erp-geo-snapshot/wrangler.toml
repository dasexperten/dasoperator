# erp-geo-snapshot — nightly GEO measurement: Cloudflare edge analytics + Search Console.
# Timer moved from the agent seat julian-geo ("45 0 * * *") on 2026-09-18; code in workers/_geo.
name = "erp-geo-snapshot"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "081ddb85cb399ad62a70210328d744fc"
workers_dev = true

# DB = run log (das_erp_dev). GEO_DB = the board database that holds geo_* tables.
[[d1_databases]]
binding = "DB"
database_name = "das_erp_dev"
database_id = "0653d156-5069-4c46-a496-fad982d0d1df"

[[d1_databases]]
binding = "GEO_DB"
database_name = "das_org"
database_id = "56cd51f7-6502-4754-bcc6-23da52a34b0d"

# Keys (secrets): CF_ANALYTICS_TOKEN, GSC_CLIENT_ID, GSC_CLIENT_SECRET, GSC_REFRESH_TOKEN.
[vars]
CF_ZONE_ID = "8754d20d716a017b21d6179a53133247"

[triggers]
crons = ["45 0 * * *"]
