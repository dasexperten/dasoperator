# erp-modulbank-sync — hourly Modulbank API history import for DEE accounts.
name = "erp-modulbank-sync"
main = "src/index.ts"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]
account_id = "081ddb85cb399ad62a70210328d744fc"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "das_erp_dev"
database_id = "0653d156-5069-4c46-a496-fad982d0d1df"

[[services]]
binding = "ERP"
service = "dasoperator-api"

[triggers]
crons = ["15 * * * *"]
