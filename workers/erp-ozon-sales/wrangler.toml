# erp-ozon-sales — Ozon sales (last 7 days) into the ERP
# Timer moved from the agent seat (dasha-ozon) on 2026-09-18; code in workers/_marketplace.
name = "erp-ozon-sales"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "081ddb85cb399ad62a70210328d744fc"
workers_dev = true

# DB = run log, ERP_DB = the marketplace tables; both are das_erp_dev.
[[d1_databases]]
binding = "DB"
database_name = "das_erp_dev"
database_id = "0653d156-5069-4c46-a496-fad982d0d1df"

[[d1_databases]]
binding = "ERP_DB"
database_name = "das_erp_dev"
database_id = "0653d156-5069-4c46-a496-fad982d0d1df"

# Keys (secrets): OZON_API_KEY. Client id is not a secret.
[vars]
OZON_CLIENT_ID = "374116"

[triggers]
# 01:00 Yerevan (21:00 UTC on the previous calendar day).
crons = ["0 21 * * *"]
