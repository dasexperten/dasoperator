# erp-site-order-retry — .ru storefront: retry paid orders without shipment, shipment statuses, buyer letters (sent by the storefront)
# Timer moved from the agent seat dasha-ozon on 2026-09-18; the job runs in the ERP (api/src/cron-steps.ts) on its .ru token and Ozon key.
name = "erp-site-order-retry"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "081ddb85cb399ad62a70210328d744fc"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "das_erp_dev"
database_id = "0653d156-5069-4c46-a496-fad982d0d1df"

[[services]]
binding = "ERP"
service = "dasoperator-api"

[triggers]
crons = ["7,22,37,52 * * * *"]
