# Metadata-only alarm: every three minutes, 08:00 through 23:27 Moscow.
name = "erp-ugc-direct"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "081ddb85cb399ad62a70210328d744fc"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "das_erp_dev"
database_id = "0653d156-5069-4c46-a496-fad982d0d1df"

[[services]]
binding = "ERP"
service = "dasoperator-api"

[triggers]
crons = ["*/3 5-19 * * *", "0-27/3 20 * * *", "*/3 2-4 * * *", "30-57/3 20 * * *", "*/3 21 * * *"]
