# Vietnam retail e-invoices: SwiftHub completion event -> ERP outbox -> EasyInvoice HSM API.
name = "erp-vn-einvoice"
main = "src/index.ts"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]
account_id = "081ddb85cb399ad62a70210328d744fc"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "das_erp_dev"
database_id = "0653d156-5069-4c46-a496-fad982d0d1df"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "das-erp-docs-dev"

[vars]
# UAT: SoftDreams demo tenant. Verified 2026-09-25 over HTTPS with a valid
# certificate (status call answered Status 2). api.easyinvoice.vn is the
# production host; the demo account answers 176 there. Switch back to
# https://api.easyinvoice.vn only together with production credentials.
EASYINVOICE_BASE_URL = "https://appdemo.softdreams.vn"
EASYINVOICE_ENABLED = "0"
EASYINVOICE_PATTERN = "1C26TAA"
# Circular 78 combines the former template and symbol in Pattern. EasyInvoice
# v8 requires an explicitly empty Serial for patterns such as 1C26TAA.
EASYINVOICE_SERIAL = ""

[triggers]
crons = ["*/5 * * * *"]
