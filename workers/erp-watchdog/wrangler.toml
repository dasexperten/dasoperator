# erp-watchdog — integration watchdog + report of failed erp-* runs to Telegram. Every 3 h (Owner 2026-09-18: "each 3 hours not less").
# Timer moved out of dasoperator-api "*/10 * * * *" on 2026-09-18; the job runs in the ERP on its keys.
name = "erp-watchdog"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "081ddb85cb399ad62a70210328d744fc"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "das_erp_dev"
database_id = "0653d156-5069-4c46-a496-fad982d0d1df"

[[services]]
binding = "ERP"
service = "dasoperator-api"

[triggers]
crons = ["20 */3 * * *"]
