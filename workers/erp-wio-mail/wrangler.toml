# erp-wio-mail — Wio Business notifications from dasexperten@gmail.com → ERP bank lines (DEI),
# then the Gmail thread is archived. Owner 2026-10-17: «перейдем к Wio, исправим адрес отправителя,
# подключим ящик». Sender is communications@mail.wio.io. Code in workers/_bank/wio-mail.mjs.
name = "erp-wio-mail"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "081ddb85cb399ad62a70210328d744fc"
workers_dev = true

# DB = run log + bank_transactions (das_erp_dev).
[[d1_databases]]
binding = "DB"
database_name = "das_erp_dev"
database_id = "0653d156-5069-4c46-a496-fad982d0d1df"

# Gmail (dasexperten@gmail.com) through the existing bridge: find, get_thread, modify(archive).
[[services]]
binding = "EMAILER"
service = "emailer-bridge"

# Keys (secrets): ERP_RUN_SECRET (manual /run).

[triggers]
# 04:40 Yerevan every day (00:40 UTC): after Modulbank mail (00:30), before bank match (02:00).
crons = ["40 0 * * *"]
